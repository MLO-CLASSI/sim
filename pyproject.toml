[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classi-sim"
version = "0.1.0"
description = "Detector and instrument simulator for the MLO CLASSI spectrograph"
readme = "README.md"
authors = [
    {name = "Caden Gobat", email = "cgobat@sdsu.edu"},
]
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "numpy",
    "pandas",
    "classi-shared-data",
    "specreduce>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["simulator", "simulator.components"]
package-dir = {simulator = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
