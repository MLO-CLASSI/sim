[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classi-sim"
version = "0.1.0"
description = "Detector and instrument simulator for the MLO CLASSI spectrograph"
readme = "README.md"
authors = [
    {name = "Caden Gobat", email = "cgobat@sdsu.edu"},
]
requires-python = ">=3.10"
dependencies = [
    "astropy",
    "numpy",
    "pandas",
    "classi-shared-data",
]

[tool.setuptools]
packages = ["simulator"]
package-dir = {simulator = "src"}
